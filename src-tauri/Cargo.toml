[package]
name = "uni-switch"
version = "0.5.29"
description = "Codex 与 Claude Code 桌面及 CLI API 配置工具"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/dieqiyun/uni-switch"

[lib]
name = "uni_switch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uni-switch"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-autostart"]
qa-webview = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
tauri = { version = "2", optional = true , features = ["tray-icon"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
url = "2"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
