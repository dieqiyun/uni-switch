name: Pull request checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Fork contributions run without repository write permissions or release secrets.
permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Audit publishable source
        run: python scripts/audit-source.py
      - name: Verify fixed source and complete Git archive
        run: node scripts/check-upstream-source.mjs --index
      - name: Frontend tests
        run: corepack pnpm test
      - name: TypeScript and production build
        run: corepack pnpm build

  rust:
    name: Rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-22.04
          - platform: Windows
            runner: windows-2022
          - platform: macOS
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: false
      - name: Prepare locked dependency source for tray contract tests
        working-directory: backend
        run: go mod download github.com/wailsapp/wails/v3
      - name: Go core tests
        run: node scripts/test-go.mjs -timeout=20m -p=2
      - name: Go vet
        run: node scripts/test-go.mjs vet
      - name: Go race detector
        if: runner.os == 'Linux'
        run: node scripts/test-go.mjs -race -timeout=30m -p=2
      - name: Build own Go core
        run: node scripts/build-go.mjs
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - name: Rust tests with isolated fixtures
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Embedded core management contract
        run: node scripts/qa-source-core.mjs
      - name: Clippy including desktop targets
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  required:
    # Keep this name stable: the main branch ruleset requires this exact check.
    name: PR checks
    needs: [frontend, rust]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$RUST_RESULT" = success
